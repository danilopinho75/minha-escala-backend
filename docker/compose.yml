services:
  minha-escala-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: minha-escala-api
    working_dir: /app
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      PORT: 3333
      DATABASE_URL: mysql://admin:pass@mysql:3306/minha_escala
      JWT_SECRET: ${JWT_SECRET:-minha_chave_secreta}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    ports:
      - "3333:3333"
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
    command: >-
      sh -c "
        echo '[API] Gerando o cliente Prisma...' &&
        npx prisma generate &&
        echo '[API] Cliente Prisma gerado.' &&
        echo '[API] Iniciando servidor Node.js em modo desenvolvimento...' &&
        npm run dev
      "

  mysql:
    image: mysql:8.4
    container_name: minha-escala-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-minha_escala}
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pass}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  node_modules:
